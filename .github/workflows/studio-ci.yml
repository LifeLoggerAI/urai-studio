name: Studio CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-studio:
    name: Typecheck, lint, test, build, and smoke studio
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SITE_URL: https://www.uraistudio.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
      FIREBASE_PROJECT_ID: ci-placeholder
      FIREBASE_CLIENT_EMAIL: ci@example.com
      FIREBASE_PRIVATE_KEY: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release check
        shell: bash
        run: |
          mkdir -p ci-receipts
          set -o pipefail
          pnpm release:check 2>&1 | tee ci-receipts/release-check.log

      - name: Static smoke declaration
        shell: bash
        run: |
          mkdir -p ci-receipts
          set -o pipefail
          pnpm --filter studio smoke:static 2>&1 | tee ci-receipts/static-smoke.log

      - name: Start Studio server
        run: |
          pnpm --filter studio start > /tmp/urai-studio.log 2>&1 &
          echo $! > /tmp/urai-studio.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/urai-studio.log
          exit 1

      - name: Runtime HTTP smoke
        env:
          HOST: http://127.0.0.1:3000
          EXPECT_READY: "false"
        shell: bash
        run: |
          mkdir -p ci-receipts
          set -o pipefail
          bash scripts/smoke.sh 2>&1 | tee ci-receipts/runtime-smoke.log

      - name: Upload CI receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-ci-receipts-${{ github.run_id }}
          path: |
            ci-receipts
            /tmp/urai-studio.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop Studio server
        if: always()
        run: |
          if [ -f /tmp/urai-studio.pid ]; then
            kill $(cat /tmp/urai-studio.pid) || true
          fi
