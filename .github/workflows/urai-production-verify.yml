name: URAI Production Verify

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: urai-production-verify-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Exact-head source build, test, and QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reviewed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify exact clean checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Run optional URAI QA
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['urai:qa'] ? 0 : 1)"; then
            pnpm urai:qa
          else
            echo 'No urai:qa script is defined; mandatory release guards run in Studio CI.'
          fi

      - name: Preserve source-only classification
        run: |
          echo 'This workflow performs no deployment, provider execution, credential validation, DNS action, or live-production verification.'
