name: URAI Production Verify

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: urai-studio-production-verify-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Build, test, and QA
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Enable exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          test "$(pnpm --version)" = "9.7.0"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-receipts
          pnpm install --frozen-lockfile 2>&1 | tee ci-receipts/install.log
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run exact-head verification suite
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-receipts
          status=0
          run_check() {
            local name="$1"
            shift
            "$@" 2>&1 | tee "ci-receipts/${name}.log"
            local code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then status=1; fi
          }
          run_check typecheck pnpm run typecheck
          run_check tests pnpm test
          run_check build pnpm run build
          run_check functions-build pnpm --dir functions build
          run_check urai-qa pnpm run urai:qa --if-present
          printf '%s\n' "$status" > ci-receipts/status.txt
          exit 0

      - name: Write exact-head receipt
        if: always()
        shell: bash
        run: |
          cat > ci-receipts/receipt.txt <<EOF
          URAI Studio exact-head production verification receipt
          Repository: ${GITHUB_REPOSITORY}
          Candidate: ${TARGET_SHA}
          Checked out: $(git rev-parse HEAD)
          Run ID: ${GITHUB_RUN_ID}
          Certification: false
          Deployment: false
          Boundary: source verification only; emulator migration, live integrations, provider rails, deployment, monitoring and rollback remain separate gates.
          EOF

      - name: Upload exact-head verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-studio-production-verify-${{ env.TARGET_SHA }}
          path: ci-receipts/**
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce exact-head result and clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ci-receipts/status.txt)" = "0"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git status --porcelain=v1 --untracked-files=all | tee ci-receipts/final-source-status.log
          test ! -s ci-receipts/final-source-status.log
