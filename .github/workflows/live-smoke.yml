name: Live Smoke

on:
  workflow_dispatch:
    inputs:
      host:
        description: Live host to verify
        required: true
        default: https://www.uraistudio.com
      expect_ready:
        description: Whether /readyz must return ready
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      expect_protected_auth:
        description: Whether protected Studio APIs must reject unauthenticated requests
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
          - 'auto'

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 9.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Run live smoke
        env:
          HOST: ${{ inputs.host }}
          EXPECT_READY: ${{ inputs.expect_ready }}
          EXPECT_PROTECTED_AUTH: ${{ inputs.expect_protected_auth }}
        run: pnpm smoke
