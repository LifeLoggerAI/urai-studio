name: Studio Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: studio-audit-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  audit:
    name: Exact-head repository audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reviewed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify exact clean checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Done-done guard
        run: pnpm done-done:guard

      - name: Evidence schema guard
        run: pnpm evidence:guard

      - name: Release evidence boundary guard
        run: pnpm release:evidence:guard

      - name: Health summary guard
        run: pnpm health:guard

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Auto-discovered tests
        run: pnpm test

      - name: Integration contract test
        run: node apps/studio/tests/integrations.test.mjs

      - name: Create-job validation test
        run: node apps/studio/tests/create-job-validation.test.mjs

      - name: App build
        run: pnpm build

      - name: Functions build
        run: pnpm --dir functions build

      - name: Studio smoke contract
        run: pnpm studio:smoke
