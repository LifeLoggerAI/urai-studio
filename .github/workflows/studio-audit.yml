name: Studio Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 9.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm private-family-film:guard
      - run: pnpm done-done:guard
      - run: node scripts/evidence-schema-guard.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node apps/studio/tests/integrations.test.mjs
      - run: node apps/studio/tests/create-job-validation.test.mjs
      - run: pnpm build
      - run: pnpm --dir functions install --no-frozen-lockfile
      - run: pnpm --dir functions build
      - run: pnpm studio:smoke
