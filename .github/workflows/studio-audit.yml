name: Studio Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, security/current-membership-authority-20260830, fix/studio-spatial-wire-compat-20260903]

permissions:
  contents: read

concurrency:
  group: studio-audit-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  audit:
    name: Exact-head repository audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reviewed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify exact clean checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java for membership/rules emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Life Film canon guard
        run: pnpm life-film:canon:guard

      - name: Done-done guard
        run: pnpm done-done:guard

      - name: Evidence schema guard
        run: pnpm evidence:guard

      - name: Release evidence contract
        run: pnpm release:evidence:contract

      - name: Health summary guard
        run: pnpm health:guard

      - name: Provider readiness posture
        run: pnpm provider:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Studio tests
        run: pnpm test

      - name: Membership migration tests
        run: pnpm test:membership-migration

      - name: Firestore and Storage rules emulator matrix
        run: pnpm test:rules

      - name: Studio source smoke
        run: pnpm studio:smoke

      - name: App build
        run: pnpm build

      - name: Functions build
        run: pnpm --dir functions build

      - name: Verify audit preserved exact source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
