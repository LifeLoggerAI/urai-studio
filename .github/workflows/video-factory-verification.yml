name: URAI Studio Video Factory Verification

concurrency:
  group: urai-studio-video-factory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/studio/**'
      - 'packages/**'
      - 'scripts/studio-video-*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '_audit/20260623_urai_studio_video_factory/**'
      - '.github/workflows/video-factory-verification.yml'
  push:
    paths:
      - 'apps/studio/**'
      - 'packages/**'
      - 'scripts/studio-video-*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '_audit/20260623_urai_studio_video_factory/**'
      - '.github/workflows/video-factory-verification.yml'

jobs:
  verify-video-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact event source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prove exact clean checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '9.7.0'

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Test
        run: pnpm --filter studio test

      - name: Typecheck
        run: pnpm --filter studio typecheck

      - name: Build
        run: pnpm --filter studio build

      - name: Install browser for route capture
        run: pnpm --filter studio exec playwright install chromium

      - name: Start Studio server
        run: |
          pnpm --filter studio exec next dev --hostname 0.0.0.0 --port 3000 > /tmp/urai-studio-dev.log 2>&1 &
          echo $! > /tmp/urai-studio-dev.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/studio/video-factory >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/urai-studio-dev.log
          exit 1

      - name: Generate render artifacts
        env:
          STUDIO_BASE_URL: http://127.0.0.1:3000
        run: pnpm run video-factory:render-artifacts

      - name: Checkout exact Spatial candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: LifeLoggerAI/urai-spatial
          ref: 59ba5476b832ddc3c3724b26f37d4e3e77313bd2
          path: spatial-source
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node 22 for exact Spatial build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Build exact Spatial candidate locally
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C spatial-source rev-parse HEAD)" = "59ba5476b832ddc3c3724b26f37d4e3e77313bd2"
          test -z "$(git -C spatial-source status --porcelain --untracked-files=all)"
          corepack prepare pnpm@10.0.0 --activate
          cd spatial-source
          pnpm install --frozen-lockfile
          NEXT_PUBLIC_URAI_BUILD_SHA=59ba5476b832ddc3c3724b26f37d4e3e77313bd2           URAI_LOCATION_MAP_ACCEPTANCE_FIXTURES=1           URAI_FIREBASE_STATIC_EXPORT=true           pnpm build:static
          test -z "$(git status --porcelain --untracked-files=all)"
          cd ..

      - name: Restore Node 20 for Studio motion proof
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Restore Studio pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.7.0 --activate

      - name: Restore browser for exact Spatial route capture
        run: pnpm --filter studio exec playwright install chromium

      - name: Serve exact Spatial candidate locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory spatial-source/urai-tier1/out > /tmp/urai-spatial-preview.log 2>&1 &
          echo $! > /tmp/urai-spatial-preview.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/urai-spatial-preview.log
          exit 1

      - name: Capture exact Spatial route evidence
        env:
          SPATIAL_BASE_URL: http://127.0.0.1:4173
          URAI_SPATIAL_EXPECTED_SHA: 59ba5476b832ddc3c3724b26f37d4e3e77313bd2
        run: pnpm run video-factory:capture

      - name: Compose and verify playable diagnostic MP4
        env:
          URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          node scripts/studio-video-compose-diagnostic.mjs

      - name: Compose and verify semantic-ready motion MP4
        env:
          URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm run video-factory:compose-motion

      - name: Upload Video Factory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-studio-video-factory-evidence
          path: |
            _audit/20260623_urai_studio_video_factory/**
            /tmp/urai-studio-dev.log
